name: LINE Mini App Frontend CI

on:
  pull_request:
    branches: [ "develop","main" ]
    paths:
      - 'miniApp/frontend/**'

workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./miniApp/frontend
      
    steps:
      - name: Check Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: miniApp/frontend/package-lock.json
      
      - name: Restore Next.js Build cache
        uses: actions/cache@v4
        with:
          path: miniApp/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('miniApp/frontend/package-lock.json') }}-${{ hashFiles('miniApp/frontend/**/*.[jt]s', 'miniApp/frontend/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('miniApp/frontend/package-lock.json') }}-
      
      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run build
        run: npm run build